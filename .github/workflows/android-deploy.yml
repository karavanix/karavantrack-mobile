name: Deploy Flutter Android to Google Play

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build Android App Bundle
        env:
          KEYSTORE_PATH: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # flutter_background_geolocation licence for yool.live.app. Without
          # it the release build still succeeds but tracking is locked.
          BG_LICENSE_KEY: ${{ secrets.BG_LICENSE_KEY_ANDROID }}
        run: |
          if [ -z "$BG_LICENSE_KEY" ]; then
            echo "::error::BG_LICENSE_KEY_ANDROID secret is empty"
            exit 1
          fi
          flutter build appbundle --release

      # Kept on the run even when the Play upload fails: the Play API can
      # reject an edit (e.g. "You must let us know whether your app includes
      # any health features") while a manual upload in Play Console works.
      - name: Keep AAB as Run Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload AAB to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: yool.live.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          # Google Play now requires this app's edits to go through manual
          # review (see the Prominent Disclosure policy issue) — the API
          # rejects an auto-submit-for-review with "Changes cannot be sent
          # for review automatically". Committing without changesNotSentForReview
          # still uploads and publishes to the internal track; review submission
          # then happens from the Play Console UI.
          changesNotSentForReview: true
